<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Dashboard</title>
    <!-- Tailwind CSS for modern grid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.6); border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen p-4 flex flex-col justify-between overflow-hidden">

    <!-- Compact Top Bar: Clock & Weather -->
    <header class="flex justify-between items-center bg-slate-900/70 backdrop-blur-xl px-6 py-3 rounded-2xl border border-slate-800 shadow-xl">
        <div class="flex items-baseline gap-3">
            <h1 id="clock" class="text-3xl font-extrabold tracking-tight text-white">00:00:00</h1>
            <p id="date" class="text-slate-400 text-sm font-medium">Loading date...</p>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xl font-bold text-sky-400">72°F</span>
            <span class="text-slate-400 text-sm">Los Angeles</span>
        </div>
    </header>

    <!-- Main Grid Section (Maximized Efficiency) -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-4 my-4 flex-1 overflow-hidden">
        
        <!-- Calendar Agenda View (Takes up 2 columns) -->
        <div class="md:col-span-2 bg-slate-900/70 backdrop-blur-xl p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col overflow-hidden">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                📅 Agenda
            </h2>
            <div class="flex-1 bg-slate-950/40 rounded-xl p-2 overflow-hidden border border-slate-800/60 flex items-center justify-center">
                <iframe src="https://calendar.google.com/calendar/embed?src=markbazikian22%40gmail.com&ctz=America%2FLos_Angeles&mode=AGENDA&showTitle=0&showNav=0&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0" 
                    style="border:0" width="100%" height="100%" frameborder="0" scrolling="yes" class="rounded-lg w-full h-full"></iframe>
            </div>
        </div>

        <!-- Google Sheets Task Feed Widget -->
        <div class="bg-slate-900/70 backdrop-blur-xl p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col overflow-hidden">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                ☑️ Tasks
            </h2>
            <div class="flex-1 bg-slate-950/40 rounded-xl p-2 overflow-hidden border border-slate-800/60 flex items-center justify-center">
                <!-- Cleaned Google Sheets embed iframe -->
                <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT61nShMqmH47lPcZ6o8Ccg0S3vC-8NmBDDiSP6XjzAyutaxqk8S9zgXohFKRZrAASIkoNoZUpTcM_L/pubhtml?widget=true&amp;headers=false&amp;chrome=false" 
                    style="border:0" width="100%" height="100%" frameborder="0" scrolling="no" class="rounded-lg w-full h-full invert hue-rotate-180 opacity-90"></iframe>
            </div>
        </div>

    </main>

    <!-- Scripts: Clock + Auto-Refresh Every Minute -->
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Refresh entire page every 60 seconds so task sheet & calendar stay fully synced
        setTimeout(function() {
            location.reload();
        }, 60000);
    </script>

</body>
</html>
