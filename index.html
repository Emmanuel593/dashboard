<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Dashboard</title>
    <!-- Tailwind CSS for modern grid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.6); border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen p-3 flex flex-col justify-between overflow-hidden">

    <!-- Ultra-Slim Top Bar: Just the Clock & Date -->
    <header class="flex justify-between items-center bg-slate-900/75 backdrop-blur-xl px-5 py-2 rounded-xl border border-slate-800 shadow-lg">
        <div class="flex items-center gap-3">
            <h1 id="clock" class="text-2xl font-extrabold tracking-tight text-white">00:00:00</h1>
            <p id="date" class="text-slate-400 text-xs font-medium">Loading date...</p>
        </div>
    </header>

    <!-- Main Grid Section (Maximized Height & Adjusted Ratios) -->
    <main class="grid grid-cols-1 md:grid-cols-4 gap-3 my-3 flex-1 overflow-hidden">
        
        <!-- Calendar Agenda View (Fatter: Takes up 3 columns) -->
        <div class="md:col-span-3 bg-slate-900/75 backdrop-blur-xl p-3 rounded-xl border border-slate-800 shadow-xl flex flex-col overflow-hidden">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                📅 Agenda
            </h2>
            <div class="flex-1 bg-slate-950/40 rounded-lg p-1 overflow-hidden border border-slate-800/60 flex items-center justify-center">
                <iframe src="https://calendar.google.com/calendar/embed?src=markbazikian22%40gmail.com&ctz=America%2FLos_Angeles&mode=AGENDA&showTitle=0&showNav=0&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0" 
                    style="border:0" width="100%" height="100%" frameborder="0" scrolling="yes" class="rounded-lg w-full h-full"></iframe>
            </div>
        </div>

        <!-- Notion Task Column (Smaller/Thinner: Takes up 1 column) -->
        <div class="md:col-span-1 bg-slate-900/75 backdrop-blur-xl p-3 rounded-xl border border-slate-800 shadow-xl flex flex-col overflow-hidden">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                ☑️ Tasks
            </h2>
            <div class="flex-1 bg-slate-950/40 rounded-lg p-1 overflow-hidden border border-slate-800/60 flex items-center justify-center">
                <!-- Your live Notion embed link -->
                <iframe src="https://honey-clef-a22.notion.site/ebd//9a1f353fc77d4528a960f24ece171982" 
                    style="border:0" width="100%" height="100%" frameborder="0" scrolling="yes" class="rounded-lg w-full h-full invert hue-rotate-180 opacity-90"></iframe>
            </div>
        </div>

    </main>

    <!-- Scripts: Clock + Auto-Refresh Every Minute -->
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Refresh entire page every 60 seconds to sync any changes made on your phone
        setTimeout(function() {
            location.reload();
        }, 60000);
    </script>

</body>
</html>
