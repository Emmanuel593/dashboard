<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.6); border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen p-3 flex flex-col justify-between overflow-hidden">

    <!-- Full-Screen Calendar Container -->
    <main class="w-full h-full bg-slate-900/75 backdrop-blur-xl p-3 rounded-xl border border-slate-800 shadow-xl flex flex-col overflow-hidden">
        <div class="flex-1 bg-slate-950/40 rounded-lg p-1 overflow-hidden border border-slate-800/60 flex items-center justify-center">
            <iframe src="https://calendar.google.com/calendar/embed?src=markbazikian22%40gmail.com&ctz=America%2FLos_Angeles&mode=AGENDA&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0&showTz=0" 
                style="border:0" width="100%" height="100%" frameborder="0" scrolling="yes" class="rounded-lg w-full h-full"></iframe>
        </div>
    </main>

    <!-- Auto-Refresh Every Minute -->
    <script>
        setTimeout(function() {
            location.reload();
        }, 60000);
    </script>

</body>
</html>
